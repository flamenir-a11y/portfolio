<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>אתגרי מוח — מערך כוח-העל שלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Suez+One&family=Assistant:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin:0; direction:rtl; font-family:'Assistant','Segoe UI',sans-serif; background:#FFFFFF; color:#3A362E; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px; }
  h1 { font-family:'Suez One','Times New Roman',serif; font-weight:400; font-size:1.4rem; margin:0 0 20px; text-align:center; }
  .grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:10px; }
  .cell { border-radius:6px; overflow:hidden; box-shadow:0 0 0 0.5px rgba(58,54,46,0.12); }
  img { width:100%; height:100%; object-fit:cover; display:block; }
  @media (max-width:600px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
  <div class="wrap">
    <h1>אתגרי מוח — מערך כוח-העל שלי</h1>
    <div class="grid">
      <div class="cell"><img src="../assets/thumbs/brain-challenge/1.png" alt="אתגר מוח 1" loading="lazy"></div>
      <div class="cell"><img src="../assets/thumbs/brain-challenge/2.png" alt="אתגר מוח 2" loading="lazy"></div>
      <div class="cell"><img src="../assets/thumbs/brain-challenge/3.png" alt="אתגר מוח 3" loading="lazy"></div>
    </div>
  </div>
</body>
</html>
